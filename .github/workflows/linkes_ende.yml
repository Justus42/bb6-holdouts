name: linkes_ende

# Gruppe 1, Thread "Linkes Ende, Entscheidungstest" (reine Analyse, kein Rocq).
# Startet bei einem Push, der analyse/gruppe1/linkes_ende/auftrag.txt aendert (Workflow liegt nur auf
# dem Feature-Branch, workflow_dispatch geht dort nicht), oder manuell, sobald der Workflow auf main liegt.
# auftrag.txt: Zeile "direkt <Schritte>" (direkte Simulation, zweites Programm) und
#              Zeile "beschleuniger <Schritte>" (Beschleuniger, so weit wie moeglich).
# Jobs:
#   direkt (A, C, D):        direkt.c bis <direkt>: Schnappschuesse (crc bei r = 0) und Formen, Halt in jedem Schritt geprueft
#   beschleuniger (A, C, D): beschleuniger.py bis <direkt> im Pruefmodus und im Laufmodus (Formen),
#                            danach Laufmodus bis 10^16 und (darf am Zeitlimit scheitern) bis <beschleuniger>
#   vergleich:               Schnappschuesse und Formen bis <direkt> zeilengleich?
on:
  push:
    paths:
      - analyse/gruppe1/linkes_ende/auftrag.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direkt:
    strategy:
      fail-fast: false
      matrix:
        start: [A, C, D]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: direkte Simulation
        working-directory: analyse/gruppe1/linkes_ende
        run: |
          N=$(awk '$1=="direkt"{print $2}' auftrag.txt)
          gcc -O2 -Wall -o direkt direkt.c
          mkdir -p aus
          start=$(date +%s)
          ./direkt ${{ matrix.start }} "$N" 0 aus/d_schnapp_${{ matrix.start }}.txt aus/d_formen_${{ matrix.start }}.txt | tee aus/d_log_${{ matrix.start }}.txt
          echo "Laufzeit $(( $(date +%s) - start )) s" | tee -a aus/d_log_${{ matrix.start }}.txt
          gzip aus/d_schnapp_${{ matrix.start }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: direkt-${{ matrix.start }}
          path: analyse/gruppe1/linkes_ende/aus/

  beschleuniger:
    strategy:
      fail-fast: false
      matrix:
        start: [A, C, D]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Beschleuniger
        working-directory: analyse/gruppe1/linkes_ende
        run: |
          N=$(awk '$1=="direkt"{print $2}' auftrag.txt)
          s=${{ matrix.start }}
          mkdir -p aus
          python3 --version
          python3 beschleuniger.py $s "$N" pruef aus/b_schnapp_$s.txt 0 | tee aus/b_pruef_log_$s.txt
          python3 beschleuniger.py $s "$N" lauf aus/b_bisdirekt_$s | tee aus/b_bisdirekt_log_$s.txt
          gzip aus/b_schnapp_$s.txt
          start=$(date +%s)
          python3 beschleuniger.py $s 1e16 lauf aus/b_e16_$s | tee aus/b_e16_log_$s.txt
          echo "Laufzeit $(( $(date +%s) - start )) s" | tee -a aus/b_e16_log_$s.txt
      - name: Beschleuniger bis zum Ziel aus auftrag.txt (darf am Zeitlimit scheitern)
        continue-on-error: true
        timeout-minutes: 240
        working-directory: analyse/gruppe1/linkes_ende
        run: |
          NB=$(awk '$1=="beschleuniger"{print $2}' auftrag.txt)
          s=${{ matrix.start }}
          start=$(date +%s)
          python3 beschleuniger.py $s "$NB" lauf aus/b_weit_$s | tee aus/b_weit_log_$s.txt
          echo "Laufzeit $(( $(date +%s) - start )) s" | tee -a aus/b_weit_log_$s.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: beschleuniger-${{ matrix.start }}
          path: analyse/gruppe1/linkes_ende/aus/

  vergleich:
    needs: [direkt, beschleuniger]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: art
      - name: Schnappschuesse und Formen vergleichen
        run: |
          ok=1
          for s in A C D; do
            if cmp <(zcat art/direkt-$s/d_schnapp_$s.txt.gz) <(zcat art/beschleuniger-$s/b_schnapp_$s.txt.gz); then
              echo "$s: Schnappschuesse gleich ($(zcat art/direkt-$s/d_schnapp_$s.txt.gz | wc -l) Zeilen)"
            else echo "$s: Schnappschuesse VERSCHIEDEN"; ok=0; fi
            if cmp <(sed 's/ #.*//' art/beschleuniger-$s/b_bisdirekt_${s}_rueckfall.txt) art/direkt-$s/d_formen_$s.txt; then
              echo "$s: Formen gleich ($(wc -l < art/direkt-$s/d_formen_$s.txt) Zeilen)"
            else echo "$s: Formen VERSCHIEDEN"; ok=0; fi
            cat art/direkt-$s/d_log_$s.txt
          done
          test $ok = 1
